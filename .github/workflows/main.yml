name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What the tournament PC does: install-tournament.bat, then run from source
  test:
    name: Tests / Python ${{ matrix.python }}
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # oldest supported version and the one the tournament PC runs
        python: ['3.12', '3.15']
    env:
      # Same as install-tournament.bat: PyYAML has no prebuilt wheel for the newest Python versions
      PYYAML_FORCE_LIBYAML: '0'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python }}
        cache: pip
        cache-dependency-path: requirements-tournament.txt

    - name: Install tournament dependencies
      run: python -m pip install -r requirements-tournament.txt pytest

    - name: Run tests / pytest
      run: python -m pytest tests

    - name: Import tournament entry points
      run: python -c "import timerecorder.tournament, timerecorder.leaderboard, timerecorder.adminPortal"

  lint:
    name: Lint / pylint
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: requirements.txt

    - name: Install dependencies
      run: python -m pip install -r requirements.txt

    # Fails on any error, or when the score drops below fail-under in the rcfile
    - name: Lint code / pylint
      run: |
        python -m pylint timerecorder --rcfile=timerecorder/.pylintrc --fail-on=E,F
        python -m pylint tests --rcfile=tests/.pylintrc --fail-on=E,F
